<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Load Board{% endblock %}</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .money { text-align: right; }
        .header-link { text-decoration: none; color: #333; font-weight: bold; margin-right: 15px; }
        .profit-positive { color: green; }
        .profit-negative { color: red; }
        .back-link { display: inline-block; margin-top: 10px; color: #666; text-decoration: none; }
        .form-container { max-width: 600px; margin: 0 auto; }
        .form-box { border: 1px solid #ddd; padding: 20px; border-radius: 5px; }
        .btn { padding: 10px 15px; border: none; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-primary { background-color: #4CAF50; color: white; }
        .btn-danger { background-color: #dc3545; color: white; }
        .btn-secondary { background-color: #6c757d; color: white; }
        .warning-box { background-color: #fff3cd; border: 1px solid #ffeeba; padding: 20px; margin: 20px 0; }
        .login-box { border: 1px solid #ddd; padding: 20px; border-radius: 6px; max-width: 420px; }
        .err { color: #b00020; margin-top: 10px; }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
</html>
