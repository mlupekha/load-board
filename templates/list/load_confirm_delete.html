{% extends "base.html" %}

{% block title %}Delete Load{% endblock %}

{% block content %}
<div class="form-container" style="text-align: center;">
    <h1>Delete Load?</h1>

    <div class="warning-box">
        <p>Are you sure you want to delete load <strong>#{{ object.ref_number }}</strong>?</p>
        <p>This action cannot be undone.</p>
    </div>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'load_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
