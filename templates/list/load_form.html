{% extends "base.html" %}

{% block title %}Load Form{% endblock %}

{% block content %}
<div class="form-container">
    <h1>
        {% if header_title %}
            {{ header_title }}
        {% elif load %}
            Edit Load #{{ load.ref_number }}
        {% else %}
            Create New Load
        {% endif %}
    </h1>

    <form method="post" enctype="multipart/form-data" class="form-box">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save</button>
    </form>

    <a href="{% url 'load_list' %}" class="back-link">← Back to list</a>
</div>
{% endblock %}
