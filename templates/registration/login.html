<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <style>
    body { font-family: sans-serif; padding: 40px; max-width: 420px; margin: 0 auto; }
    .box { border: 1px solid #ddd; padding: 20px; border-radius: 6px; }
    label { display: block; margin-top: 10px; font-size: 0.9em; }
    input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 10px 14px; width: 100%; border: 0; background: #008CBA; color: white; font-weight: bold; cursor: pointer; }
    .err { color: #b00020; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Load Board</h1>

  <div class="box">
    <form method="post">
      {% csrf_token %}

      {% if form.errors %}
        <div class="err">Invalid username or password.</div>
      {% endif %}

      <label for="id_username">Username</label>
      {{ form.username }}

      <label for="id_password">Password</label>
      {{ form.password }}

      {% if next %}
        <input type="hidden" name="next" value="{{ next }}">
      {% endif %}

      <button type="submit">Log in</button>
    </form>
  </div>
</body>
</html>
