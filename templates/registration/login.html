{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="form-container">
    <h1>Load Board</h1>

    <div class="login-box">
        <form method="post">
            {% csrf_token %}

            {% if form.errors %}
                <div class="err">Invalid username or password.</div>
            {% endif %}

            {{ form.as_p }}

            {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
            {% endif %}

            <button type="submit" class="btn btn-primary">Log in</button>
        </form>
    </div>
</div>
{% endblock %}
